# VIGIA Military System - Kubernetes Deployment
# Nivel: ESTATAL-MILITAR
# Requiere: kubectl, cluster K8s, Ingress Controller

---
apiVersion: v1
kind: Namespace
metadata:
  name: vigia-system
  labels:
    security-level: "TOP_SECRET"
    system: vigia

---
# ─────────────────────────────────────────────────────────────────────
# ConfigMap - SOLO configuracion no sensible.
# Cualquier valor sensible (claves, tokens, passwords) DEBE vivir
# en un Secret, nunca aqui.
# ─────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: vigia-config
  namespace: vigia-system
data:
  VIGIA_ENV: "production"
  VIGIA_LOG_LEVEL: "INFO"
  VIGIA_ALLOWED_ORIGINS: "https://vigia.gov.int"
  SIEM_TYPE: "splunk"
  ENABLE_MAP_VIEW: "true"
  ENABLE_NETWORK_GRAPHS: "true"
  ENABLE_REPORT_GENERATOR: "true"
  ENABLE_MOBILE_SYNC: "true"
  ENABLE_STIX_EXPORT: "true"
  ENABLE_SIEM_INTEGRATION: "true"

---
# ─────────────────────────────────────────────────────────────────────
# Secret - PLANTILLA UNICAMENTE
#
# IMPORTANTE - LEER ANTES DE APLICAR:
#
#   1. Este manifest NO debe contener secretos reales en el repositorio.
#      Los placeholders <REPLACE_WITH_*> existen para que el operador
#      sepa que valor falta, no para aplicarse tal cual.
#
#   2. En produccion, gestionar este Secret con UNO de:
#        - bitnami-labs/sealed-secrets (ver k8s/sealed-secret-template.yaml)
#        - external-secrets-operator (Vault / AWS Secrets Manager / GCP SM)
#        - HashiCorp Vault Agent Injector
#        - SOPS + git-crypt para edicion controlada
#
#   3. Para un bootstrap manual de emergencia:
#        kubectl -n vigia-system create secret generic vigia-secrets \
#          --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 32)" \
#          --from-literal=JWT_SECRET_KEY="$(openssl rand -hex 32)" \
#          --from-literal=VIGIA_MASTER_KEY="$(openssl rand -hex 32)" \
#          --from-literal=VIGIA_HMAC_KEY="$(openssl rand -hex 32)" \
#          --from-literal=HMAC_SECRET="$(openssl rand -hex 32)" \
#          --from-literal=REDIS_PASSWORD="$(openssl rand -hex 32)" \
#          --from-literal=DATABASE_URL="postgresql+asyncpg://vigia:<pwd>@postgres-service:5432/vigia_db" \
#          --from-literal=TWITTER_BEARER_TOKEN="..." ...
#
#   4. Generar claves criptograficas con: openssl rand -hex 32
#
#   5. Dejar este manifest con secretos reales committeados al repo
#      es una violacion de la politica de seguridad.
#
# Se usa stringData (no data) para evitar el error de manifests previos
# donde "CHANGE_ME_BASE64_ENCODED" no era base64 valido y rompia el apply.
# Kubernetes codifica automaticamente los valores de stringData a base64.
# ─────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: vigia-secrets
  namespace: vigia-system
  annotations:
    vigia.gov.int/template: "true"
    vigia.gov.int/managed-by: "REPLACE_WITH_SEALED_SECRETS_OR_VAULT"
type: Opaque
stringData:
  # PostgreSQL
  POSTGRES_PASSWORD: "<REPLACE_WITH_64CHAR_RANDOM_HEX>"
  DATABASE_URL: "postgresql+asyncpg://vigia:<REPLACE_WITH_POSTGRES_PASSWORD>@postgres-service:5432/vigia_db"

  # Redis
  REDIS_PASSWORD: "<REPLACE_WITH_64CHAR_RANDOM_HEX>"
  REDIS_URL: "redis://:<REPLACE_WITH_REDIS_PASSWORD>@redis-service:6379"

  # Crypto
  JWT_SECRET_KEY: "<REPLACE_WITH_64CHAR_RANDOM_HEX>"
  VIGIA_MASTER_KEY: "<REPLACE_WITH_64CHAR_RANDOM_HEX>"
  VIGIA_HMAC_KEY: "<REPLACE_WITH_64CHAR_RANDOM_HEX>"
  HMAC_SECRET: "<REPLACE_WITH_64CHAR_RANDOM_HEX>"
  VIGIA_HASH_SALT: "<REPLACE_WITH_32CHAR_RANDOM_HEX>"
  VIGIA_API_KEY: "<REPLACE_WITH_API_KEY>"

  # Social media tokens
  TWITTER_BEARER_TOKEN: "<REPLACE_OR_LEAVE_EMPTY>"
  REDDIT_CLIENT_ID: "<REPLACE_OR_LEAVE_EMPTY>"
  REDDIT_CLIENT_SECRET: "<REPLACE_OR_LEAVE_EMPTY>"
  TELEGRAM_BOT_TOKEN: "<REPLACE_OR_LEAVE_EMPTY>"
  META_ACCESS_TOKEN: "<REPLACE_OR_LEAVE_EMPTY>"

  # SIEM / TAXII
  SIEM_API_TOKEN: "<REPLACE_OR_LEAVE_EMPTY>"
  TAXII_API_KEY: "<REPLACE_OR_LEAVE_EMPTY>"
  EUROPOL_API_KEY: "<REPLACE_OR_LEAVE_EMPTY>"

---
# ─────────────────────────────────────────────────────────────────────
# PostgreSQL StatefulSet
# ─────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vigia-postgres
  namespace: vigia-system
spec:
  serviceName: "postgres-service"
  replicas: 1  # Para HA: usar 3+ con Patroni
  selector:
    matchLabels:
      app: vigia-postgres
  template:
    metadata:
      labels:
        app: vigia-postgres
    spec:
      securityContext:
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "vigia"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vigia-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          value: "vigia_db"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "vigia"]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "vigia"]
          initialDelaySeconds: 5
          periodSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: "standard"
      resources:
        requests:
          storage: 100Gi

---
# ─────────────────────────────────────────────────────────────────────
# Redis Deployment
# ─────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vigia-redis
  namespace: vigia-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vigia-redis
  template:
    metadata:
      labels:
        app: vigia-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)", "--appendonly", "yes"]
        ports:
        - containerPort: 6379
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vigia-secrets
              key: REDIS_PASSWORD
        volumeMounts:
        - name: redis-data
          mountPath: /data
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: redis-data
        emptyDir: {}

---
# ─────────────────────────────────────────────────────────────────────
# Backend API Deployment (FastAPI)
# ─────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vigia-api
  namespace: vigia-system
spec:
  replicas: 3  # Escalado horizontal
  selector:
    matchLabels:
      app: vigia-api
  template:
    metadata:
      labels:
        app: vigia-api
        version: "2.1"
    spec:
      serviceAccountName: vigia-api-sa
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
      containers:
      - name: api
        image: vigia-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: vigia-config
        - secretRef:
            name: vigia-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/health/live
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /api/health/ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: models
          mountPath: /app/models
      volumes:
      - name: logs
        emptyDir: {}
      - name: models
        emptyDir: {}

---
# ─────────────────────────────────────────────────────────────────────
# Frontend Deployment (Nginx)
# ─────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vigia-frontend
  namespace: vigia-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vigia-frontend
  template:
    metadata:
      labels:
        app: vigia-frontend
    spec:
      containers:
      - name: nginx
        image: vigia-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10

---
# ─────────────────────────────────────────────────────────────────────
# Services
# ─────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: vigia-system
spec:
  selector:
    app: vigia-postgres
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: vigia-system
spec:
  selector:
    app: vigia-redis
  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: vigia-system
spec:
  selector:
    app: vigia-api
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: vigia-system
spec:
  selector:
    app: vigia-frontend
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP

---
# ─────────────────────────────────────────────────────────────────────
# Ingress (requiere Ingress Controller como NGINX)
# ─────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vigia-ingress
  namespace: vigia-system
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - vigia.gov.int
    secretName: vigia-tls
  rules:
  - host: vigia.gov.int
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-service
            port:
              number: 8000

---
# ─────────────────────────────────────────────────────────────────────
# ServiceAccount para la API
# ─────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vigia-api-sa
  namespace: vigia-system

---
# ─────────────────────────────────────────────────────────────────────
# Horizontal Pod Autoscaler (HPA)
# ─────────────────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vigia-api-hpa
  namespace: vigia-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vigia-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# ─────────────────────────────────────────────────────────────────────
# NetworkPolicy - API (permite ingress desde frontend, egress a DB/Redis/DNS/externo)
# ─────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vigia-api-net-policy
  namespace: vigia-system
spec:
  podSelector:
    matchLabels:
      app: vigia-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: vigia-frontend
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: vigia-postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: vigia-redis
    ports:
    - protocol: TCP
      port: 6379
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80

---
# ─────────────────────────────────────────────────────────────────────
# NetworkPolicy - PostgreSQL (solo acepta desde API)
# ─────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vigia-postgres-net-policy
  namespace: vigia-system
spec:
  podSelector:
    matchLabels:
      app: vigia-postgres
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: vigia-api
    ports:
    - protocol: TCP
      port: 5432
  egress:
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

---
# ─────────────────────────────────────────────────────────────────────
# NetworkPolicy - Redis (solo acepta desde API)
# ─────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vigia-redis-net-policy
  namespace: vigia-system
spec:
  podSelector:
    matchLabels:
      app: vigia-redis
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: vigia-api
    ports:
    - protocol: TCP
      port: 6379
  egress:
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

---
# ─────────────────────────────────────────────────────────────────────
# NetworkPolicy - Frontend (permite ingress desde Ingress, egress a API)
# ─────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vigia-frontend-net-policy
  namespace: vigia-system
spec:
  podSelector:
    matchLabels:
      app: vigia-frontend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - ports:
    - protocol: TCP
      port: 80
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: vigia-api
    ports:
    - protocol: TCP
      port: 8000
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
