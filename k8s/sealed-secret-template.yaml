# VIGIA - SealedSecret template for vigia-secrets
#
# Permite committear al repo el Secret encriptado con la clave publica del
# controlador sealed-secrets del cluster, que es la unica forma segura de
# tener "secretos en git". El controlador descifra y crea el Secret real
# (vigia-secrets) en el namespace vigia-system al aplicarse.
#
# Requisitos:
#   - bitnami-labs/sealed-secrets controller instalado en el cluster:
#       https://github.com/bitnami-labs/sealed-secrets
#   - kubeseal CLI instalado localmente
#
# Generar este SealedSecret a partir de un Secret real (que NUNCA se commitea):
#
#   1. Crear el Secret plano LOCALMENTE (no aplicarlo al cluster):
#        cat > /tmp/vigia-secrets.yaml <<'EOF'
#        apiVersion: v1
#        kind: Secret
#        metadata:
#          name: vigia-secrets
#          namespace: vigia-system
#        type: Opaque
#        stringData:
#          POSTGRES_PASSWORD: "$(openssl rand -hex 32)"
#          DATABASE_URL: "postgresql+asyncpg://vigia:...@postgres-service:5432/vigia_db"
#          REDIS_PASSWORD: "$(openssl rand -hex 32)"
#          JWT_SECRET_KEY: "$(openssl rand -hex 32)"
#          VIGIA_MASTER_KEY: "$(openssl rand -hex 32)"
#          VIGIA_HMAC_KEY: "$(openssl rand -hex 32)"
#          HMAC_SECRET: "$(openssl rand -hex 32)"
#          VIGIA_HASH_SALT: "$(openssl rand -hex 16)"
#          VIGIA_API_KEY: "..."
#          TWITTER_BEARER_TOKEN: "..."
#          # ... resto de tokens ...
#        EOF
#
#   2. Sellar con la clave publica del controlador:
#        kubeseal --controller-namespace=kube-system \
#                 --controller-name=sealed-secrets-controller \
#                 --format=yaml \
#                 < /tmp/vigia-secrets.yaml \
#                 > k8s/sealed-secrets/vigia-secrets.sealed.yaml
#
#   3. Borrar el Secret plano de disco:
#        shred -u /tmp/vigia-secrets.yaml
#
#   4. Commitear UNICAMENTE el archivo .sealed.yaml resultante.
#
# El bloque de abajo es solo un ejemplo de la forma del manifest sellado;
# encryptedData estaria poblado con los strings cifrados reales por kubeseal.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: vigia-secrets
  namespace: vigia-system
spec:
  template:
    metadata:
      name: vigia-secrets
      namespace: vigia-system
    type: Opaque
  encryptedData:
    POSTGRES_PASSWORD: AgB...REPLACE_WITH_OUTPUT_OF_KUBESEAL...
    DATABASE_URL: AgB...REPLACE_WITH_OUTPUT_OF_KUBESEAL...
    REDIS_PASSWORD: AgB...REPLACE_WITH_OUTPUT_OF_KUBESEAL...
    REDIS_URL: AgB...REPLACE_WITH_OUTPUT_OF_KUBESEAL...
    JWT_SECRET_KEY: AgB...REPLACE_WITH_OUTPUT_OF_KUBESEAL...
    VIGIA_MASTER_KEY: AgB...REPLACE_WITH_OUTPUT_OF_KUBESEAL...
    VIGIA_HMAC_KEY: AgB...REPLACE_WITH_OUTPUT_OF_KUBESEAL...
    HMAC_SECRET: AgB...REPLACE_WITH_OUTPUT_OF_KUBESEAL...
    VIGIA_HASH_SALT: AgB...REPLACE_WITH_OUTPUT_OF_KUBESEAL...
    VIGIA_API_KEY: AgB...REPLACE_WITH_OUTPUT_OF_KUBESEAL...
    TWITTER_BEARER_TOKEN: AgB...REPLACE_WITH_OUTPUT_OF_KUBESEAL...
    REDDIT_CLIENT_ID: AgB...REPLACE_WITH_OUTPUT_OF_KUBESEAL...
    REDDIT_CLIENT_SECRET: AgB...REPLACE_WITH_OUTPUT_OF_KUBESEAL...
    TELEGRAM_BOT_TOKEN: AgB...REPLACE_WITH_OUTPUT_OF_KUBESEAL...
    META_ACCESS_TOKEN: AgB...REPLACE_WITH_OUTPUT_OF_KUBESEAL...
    SIEM_API_TOKEN: AgB...REPLACE_WITH_OUTPUT_OF_KUBESEAL...
    TAXII_API_KEY: AgB...REPLACE_WITH_OUTPUT_OF_KUBESEAL...
    EUROPOL_API_KEY: AgB...REPLACE_WITH_OUTPUT_OF_KUBESEAL...
