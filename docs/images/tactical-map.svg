  <text x="362" y="143" font-family="Arial, sans-serif" font-size="9" fill="#f97316">NARANJA ×2</text>
  
  <!-- Paris - AMARILLO -->
  <circle cx="360" cy="160" r="8" fill="#eab308" opacity="0.3"/>
  <circle cx="360" cy="160" r="5" fill="#eab308" opacity="0.6"/>
