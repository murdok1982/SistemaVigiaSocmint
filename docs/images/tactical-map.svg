    <!-- Europe -->
    <path d="M340 150 L360 140 L380 145 L400 135 L420 140 L430 155 L420 170 L400 180 L380 175 L360 180 L340 170 Z"/>
    <!-- Iberian Peninsula -->
    <path d="M310 170 L340 165 L345 180 L335 195 L315 190 L305 180 Z" fill="#1e3a5f" stroke="#475569"/>
    <!-- Africa -->
    <path d="M340 200 L380 195 L400 220 L390 280 L360 300 L330 280 L320 240 L330 210 Z"/>
    <!-- Americas -->
    <path d="M120 120 L150 110 L170 130 L160 170 L140 200 L120 220 L100 200 L90 160 L100 130 Z"/>
    <path d="M140 240 L160 250 L170 300 L160 350 L140 370 L120 350 L110 300 L120 260 Z"/>
    <!-- Asia -->
    <path d="M450 120 L520 110 L580 130 L600 160 L580 180 L540 190 L500 180 L460 170 L440 150 Z"/>
  </g>
  
  <!-- Alert markers -->
