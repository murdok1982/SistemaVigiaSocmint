<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" style="background:#0f172a">
  <defs>
    <linearGradient id="mapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
