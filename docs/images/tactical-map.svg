  <rect x="880" y="255" width="30" height="16" rx="3" fill="#22c55e" opacity="0.2"/>
  <text x="895" y="267" font-family="Arial, sans-serif" font-size="9" fill="#22c55e" text-anchor="middle">2</text>
  
  <!-- Moscow -->
