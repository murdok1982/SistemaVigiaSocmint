  <text x="755" y="310" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">Moscow, Rusia</text>
  <text x="755" y="330" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Total: 4 alertas</text>
  <rect x="880" y="300" width="30" height="16" rx="3" fill="#ef4444" opacity="0.2"/>
