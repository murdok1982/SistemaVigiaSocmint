<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" style="background:#0f172a">
  <defs>
    <linearGradient id="loginGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background pattern -->
  <rect width="800" height="600" fill="url(#loginGrad)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="100" x2="800" y2="100" stroke="#334155" stroke-width="1"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#334155" stroke-width="1"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#334155" stroke-width="1"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke="#334155" stroke-width="1"/>
    <line x1="0" y1="500" x2="800" y2="500" stroke="#334155" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="600" stroke="#334155" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="600" stroke="#334155" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="600" stroke="#334155" stroke-width="1"/>
  </g>
  
  <!-- Shield Logo -->
  <g transform="translate(340, 60)" filter="url(#glow)">
    <path d="M60 0 L120 20 L120 70 C120 100 100 130 60 150 C20 130 0 100 0 70 L0 20 Z" 
          fill="none" stroke="#d97706" stroke-width="3"/>
    <path d="M60 20 L100 35 L100 65 C100 85 85 105 60 120 C35 105 20 85 20 65 L20 35 Z" 
          fill="#d97706" opacity="0.2"/>
    <circle cx="60" cy="70" r="20" fill="#d97706"/>
    <circle cx="60" cy="70" r="10" fill="#0f172a"/>
    <circle cx="60" cy="70" r="5" fill="#d97706"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="240" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#e2e8f0" text-anchor="middle">VIGÍA Monitor</text>
  <text x="400" y="265" font-family="Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Acceso restringido — Personal autorizado</text>
  
  <!-- Login Card -->
  <rect x="200" y="290" width="400" height="280" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  
  <!-- Card Header -->
  <text x="400" y="325" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Iniciar sesión</text>
  
  <!-- Username field -->
  <text x="230" y="365" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Usuario</text>
  <rect x="230" y="375" width="340" height="40" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="260" y="400" font-family="Arial, sans-serif" font-size="13" fill="#64748b">👤 admin</text>
  
  <!-- Password field -->
  <text x="230" y="435" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Contraseña</text>
  <rect x="230" y="445" width="340" height="40" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="260" y="470" font-family="Arial, sans-serif" font-size="13" fill="#64748b">🔒 ••••••••••••</text>
  <text x="545" y="470" font-family="Arial, sans-serif" font-size="13" fill="#64748b">👁️</text>
  
  <!-- Password strength indicator -->
  <rect x="230" y="490" width="340" height="4" rx="2" fill="#334155"/>
  <rect x="230" y="490" width="240" height="4" rx="2" fill="#22c55e"/>
  <text x="480" y="503" font-family="Arial, sans-serif" font-size="10" fill="#22c55e">Fuerte</text>
  
  <!-- Login button -->
  <rect x="230" y="520" width="340" height="40" rx="6" fill="#d97706"/>
  <text x="400" y="545" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Acceder</text>
  
  <!-- Footer text -->
  <text x="400" y="590" font-family="Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Toda actividad queda registrada para auditoría. El uso indebido es un delito tipificado.</text>
  
  <!-- Security badges -->
  <g transform="translate(250, 20)">
    <rect x="0" y="0" width="80" height="20" rx="10" fill="#ef4444" opacity="0.2"/>
    <text x="40" y="14" font-family="Arial, sans-serif" font-size="9" fill="#ef4444" text-anchor="middle">TOP SECRET</text>
  </g>
  <g transform="translate(360, 20)">
    <rect x="0" y="0" width="80" height="20" rx="10" fill="#22c55e" opacity="0.2"/>
    <text x="40" y="14" font-family="Arial, sans-serif" font-size="9" fill="#22c55e" text-anchor="middle">ENCRYPTED</text>
  </g>
  <g transform="translate(470, 20)">
    <rect x="0" y="0" width="80" height="20" rx="10" fill="#3b82f6" opacity="0.2"/>
    <text x="40" y="14" font-family="Arial, sans-serif" font-size="9" fill="#3b82f6" text-anchor="middle">MFA READY</text>
  </g>
</svg>
