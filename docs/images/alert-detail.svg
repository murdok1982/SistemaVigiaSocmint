  <text x="60" y="550" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#d97706">coordinacion_ataque</text>
  <text x="750" y="550" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Confianza: 92%</text>
  <text x="50" y="565" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">"coordinar el ataque" — Posible coordinación de ataque detectada</text>
  
  <!-- Indicator 2 -->
  <rect x="40" y="580" width="920" height="45" rx="6" fill="#0f172a"/>
  <rect x="50" y="590" width="130" height="22" rx="4" fill="#d97706" opacity="0.2"/>
  <text x="60" y="605" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#d97706">coordinacion_ataque</text>
  <text x="750" y="605" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Confianza: 88%</text>
  <text x="50" y="620" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">"punto de encuentro" — Posible coordinación de ataque detectada</text>
  
  <!-- Indicator 3 -->
  <rect x="40" y="635" width="920" height="45" rx="6" fill="#0f172a"/>
  <rect x="50" y="645" width="130" height="22" rx="4" fill="#d97706" opacity="0.2"/>
  <text x="60" y="660" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#d97706">coordinacion_ataque</text>
  <text x="750" y="660" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Confianza: 85%</text>
  <text x="50" y="675" font-family="Arial, sans-serif" font-size="11" fill="#e2e8f0">"ejecutan en simultáneo" — Posible coordinación de ataque detectada</text>
  
  <!-- Analyst Action Panel -->
