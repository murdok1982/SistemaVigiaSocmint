  <text x="40" y="230" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0">Contenido Completo</text>
  
  <rect x="40" y="245" width="920" height="80" rx="8" fill="#0f172a"/>
  <text x="55" y="270" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">"Coordinar el ataque para el viernes a primera hora. Punto de encuentro</text>
  <text x="55" y="290" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">en la plaza central. Traed el material necesario. Cuando llegue la señal,</text>
  <text x="55" y="310" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">todas las unidades ejecutan en simultáneo."</text>
  
  <text x="40" y="350" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Creado: 15/01/2024 10:30:45</text>
  <text x="250" y="350" font-family="Arial, sans-serif" font-size="12" fill="#64748b">ID: abc123-def456-ghi789</text>
  
