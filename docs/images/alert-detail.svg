    <text x="25" y="35" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">!</text>
  </g>
  
  <text x="120" y="120" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ef4444">ROJO</text>
