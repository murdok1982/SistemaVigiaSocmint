  <text x="40" y="730" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#d97706">🛡️ Acción del Analista</text>
  
  <rect x="40" y="745" width="920" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="55" y="765" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Justificación de la decisión (mínimo 10 caracteres)...</text>
  
  <!-- Action buttons -->
  <rect x="40" y="820" width="100" height="35" rx="6" fill="#ef4444"/>
  <text x="90" y="842" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">🔴 Escalar</text>
  
  <rect x="155" y="820" width="100" height="35" rx="6" fill="#475569"/>
  <text x="205" y="842" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">📁 Archivar</text>
  
  <rect x="270" y="820" width="130" height="35" rx="6" fill="#22c55e"/>
  <text x="335" y="842" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">❌ Falso Positivo</text>
