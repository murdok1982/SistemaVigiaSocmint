global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'vigia-api'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['api:8000']
        labels:
          service: 'vigia-api'
    scrape_interval: 10s

  - job_name: 'vigia-worker'
    static_configs:
      - targets: ['worker:9101']
        labels:
          service: 'vigia-worker'
    scrape_interval: 10s
